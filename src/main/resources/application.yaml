spring:
  application:
    name: subscription-service
  datasource:
    url: ${ENV_SUBSCRIPTION_DATASOURCE_URL:jdbc:postgresql://localhost:5432/subscription_db}
    username: ${ENV_SUBSCRIPTION_DATASOURCE_USERNAME:appuser}
    password: ${ENV_SUBSCRIPTION_DATASOURCE_PASSWORD:Password@123}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${SPRING_LIQUIBASE_DEFAULT_SCHEMA:subscription_mgmt}
    liquibase-schema: ${SPRING_LIQUIBASE_LIQUIBASE_SCHEMA:public}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:subscription_mgmt}
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${ENV_REDIS_HOST:localhost}
      port: ${ENV_REDIS_PORT:6379}
      password: ${ENV_REDIS_PASSWORD:}
      timeout: ${ENV_REDIS_TIMEOUT:500ms}

server:
  port: ${SERVER_PORT:8086}

app:
  eligibility-cache:
    ttl: ${SUBSCRIPTION_ELIGIBILITY_CACHE_TTL:30s}
    jitter: ${SUBSCRIPTION_ELIGIBILITY_CACHE_JITTER:3s}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://localhost:4201,http://localhost:4211,http://localhost:8080,https://dev.electrahub.com,https://dev.electrahub.com:8443,http://driver-portal-dev.electrahub.com:8080,https://driver-portal-dev.electrahub.com:8443,https://driver-portal-*.electrahub.com,https://driver-portal-*.electrahub.com:*,https://admin-portal-dev.electrahub.com,https://admin-portal-dev.electrahub.com:8443,https://admin-portal-*.electrahub.com,https://admin-portal-*.electrahub.com:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${SUBSCRIPTION_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  level:
    root: INFO
    com.electrahub.subscription: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
