databaseChangeLog:
  - changeSet:
      id: 0004-reset-new-user-promo-quota-to-5000-kwh
      author: codex
      comment: Increase the new-driver promotion to 5000 kWh and reset existing allocations with an audit trail.
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              DECLARE
                  target_plan_id UUID;
              BEGIN
                  SELECT id
                    INTO target_plan_id
                    FROM subscription_mgmt.subscription_plans
                   WHERE code = 'NEW_USER_20_OFF_500KWH_1Y';

                  IF target_plan_id IS NULL THEN
                      RAISE EXCEPTION 'Subscription plan NEW_USER_20_OFF_500KWH_1Y was not found';
                  END IF;

                  INSERT INTO subscription_mgmt.subscription_audit_logs (
                      id,
                      plan_id,
                      allocation_id,
                      user_id,
                      organization_id,
                      group_id,
                      action,
                      actor,
                      detail,
                      created_at
                  )
                  SELECT
                      md5('quota-reset-5000-kwh:' || allocation.id::text)::uuid,
                      allocation.plan_id,
                      allocation.id,
                      allocation.user_id,
                      allocation.organization_id,
                      allocation.group_id,
                      'ALLOCATION_QUOTA_RESET',
                      'system:liquibase',
                      jsonb_build_object(
                          'reason', 'Increase new-driver promotion to 5000 kWh and restore 100 percent remaining quota',
                          'previousQuotaLimit', allocation.quota_limit,
                          'previousQuotaLimitValue', allocation.quota_limit_value,
                          'previousConsumedUnits', allocation.consumed_units,
                          'previousConsumedValue', allocation.consumed_value,
                          'newQuotaLimit', 5000,
                          'newQuotaLimitValue', 5000.0000,
                          'newConsumedUnits', 0,
                          'newConsumedValue', 0.0000
                      )::text,
                      NOW()
                    FROM subscription_mgmt.subscription_allocations allocation
                   WHERE allocation.plan_id = target_plan_id
                  ON CONFLICT (id) DO NOTHING;

                  UPDATE subscription_mgmt.subscription_allocations
                     SET quota_limit = 5000,
                         quota_limit_value = 5000.0000,
                         consumed_units = 0,
                         consumed_value = 0.0000,
                         updated_at = NOW(),
                         version = version + 1
                   WHERE plan_id = target_plan_id;

                  UPDATE subscription_mgmt.subscription_plans
                     SET description = 'Automatic new-driver promotion: 20% off charging for one year or the first 5000 kWh, whichever comes first.',
                         default_quota_limit = 5000,
                         default_quota_value = 5000.0000,
                         updated_at = NOW()
                   WHERE id = target_plan_id;
              END
              $$;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              DECLARE
                  target_plan_id UUID;
              BEGIN
                  SELECT id
                    INTO target_plan_id
                    FROM subscription_mgmt.subscription_plans
                   WHERE code = 'NEW_USER_20_OFF_500KWH_1Y';

                  UPDATE subscription_mgmt.subscription_allocations allocation
                     SET quota_limit = (audit.detail::jsonb ->> 'previousQuotaLimit')::integer,
                         quota_limit_value = (audit.detail::jsonb ->> 'previousQuotaLimitValue')::numeric,
                         consumed_units = (audit.detail::jsonb ->> 'previousConsumedUnits')::integer,
                         consumed_value = (audit.detail::jsonb ->> 'previousConsumedValue')::numeric,
                         updated_at = NOW(),
                         version = allocation.version + 1
                    FROM subscription_mgmt.subscription_audit_logs audit
                   WHERE audit.id = md5('quota-reset-5000-kwh:' || allocation.id::text)::uuid
                     AND audit.action = 'ALLOCATION_QUOTA_RESET'
                     AND audit.allocation_id = allocation.id;

                  DELETE FROM subscription_mgmt.subscription_audit_logs
                   WHERE action = 'ALLOCATION_QUOTA_RESET'
                     AND actor = 'system:liquibase'
                     AND id = md5('quota-reset-5000-kwh:' || allocation_id::text)::uuid;

                  UPDATE subscription_mgmt.subscription_plans
                     SET description = 'Automatic new-driver promotion: 20% off charging for one year or the first 500 kWh, whichever comes first.',
                         default_quota_limit = 500,
                         default_quota_value = 500.0000,
                         updated_at = NOW()
                   WHERE id = target_plan_id;
              END
              $$;
